# DataKeep 多平台安装包（公开仓标准 runner 免费）
#
# 用法（网页）:
#   仓库 → Actions → 「Build packages」→ Run workflow
#   可勾选要构建的平台
#
# 用法（命令行）:
#   gh workflow run build.yml
#   gh workflow run build.yml -f android=true -f linux=true -f windows=false -f macos=false
#   gh run list --workflow=build.yml --limit 3
#   gh run download <run-id>
#
# 打 tag（如 v1.0.0）会自动编全部平台并挂到 Release。
#
# 产物 Artifacts:
#   datakeep-android / datakeep-linux-x64 / datakeep-windows-x64 / datakeep-macos

name: Build packages

on:
  workflow_dispatch:
    inputs:
      android:
        description: Android APK
        type: boolean
        default: true
      linux:
        description: Linux tar.gz
        type: boolean
        default: true
      windows:
        description: Windows zip
        type: boolean
        default: true
      macos:
        description: macOS zip
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

concurrency:
  group: build-packages-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable

jobs:
  android:
    name: Android APK
    if: github.event_name == 'push' || inputs.android
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: datakeep_flutter

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            datakeep_flutter/syncthing_core/go.sum
            syncthing/go.sum

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          link-to-sdk: true

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Build syncthing_core AAR
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          make -C syncthing_core android

      - name: Flutter pub get & APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Package
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^version:' datakeep_flutter/pubspec.yaml | awk '{print $2}')
          VERSION="${VERSION%%+*}"
          mkdir -p dist
          cp datakeep_flutter/build/app/outputs/flutter-apk/app-release.apk \
            "dist/datakeep-${VERSION}-android.apk"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: datakeep-android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux x64
    if: github.event_name == 'push' || inputs.linux
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: datakeep_flutter

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux desktop deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            xz-utils bzip2 xclip \
            libmpv-dev mpv

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: |
          flutter config --enable-linux-desktop
          flutter pub get
          # webview_cef 首次下载 CEF，耗时长
          flutter build linux --release

      - name: Package tar.gz
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^version:' datakeep_flutter/pubspec.yaml | awk '{print $2}')
          VERSION="${VERSION%%+*}"
          BUNDLE=$(find datakeep_flutter/build/linux -type d -path '*/release/bundle' | head -1)
          test -d "$BUNDLE"
          mkdir -p dist
          STAGE=$(mktemp -d)
          NAME="datakeep-${VERSION}-linux"
          mkdir -p "$STAGE/$NAME"
          cp -a "$BUNDLE"/. "$STAGE/$NAME/"
          tar -C "$STAGE" -czf "dist/${NAME}-x64.tar.gz" "$NAME"
          rm -rf "$STAGE"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: datakeep-linux-x64
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows x64
    if: github.event_name == 'push' || inputs.windows
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: datakeep_flutter

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release

      - name: Package zip
        shell: pwsh
        run: |
          $line = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches.Groups[1].Value
          $version = ($line -split '\+')[0]
          $release = Get-ChildItem -Path build\windows -Recurse -Directory |
            Where-Object { $_.FullName -match '\\runner\\Release$' } |
            Select-Object -First 1
          if (-not $release) { throw 'Release directory not found' }
          $outDir = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $name = "datakeep-$version-windows"
          $stage = Join-Path $env:RUNNER_TEMP $name
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path (Join-Path $release.FullName '*') -Destination $stage -Recurse -Force
          $zip = Join-Path $outDir "$name-x64.zip"
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          Get-Item $zip | Format-List FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: datakeep-windows-x64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS
    if: github.event_name == 'push' || inputs.macos
    runs-on: macos-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: datakeep_flutter

    steps:
      - uses: actions/checkout@v5

      - name: Install CEF build tools
        run: brew install cmake ninja || true

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: |
          flutter config --enable-macos-desktop
          flutter pub get
          # Podfile 含 webview_cef helper；首次会下载 CEF
          flutter build macos --release

      - name: Package zip
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^version:' datakeep_flutter/pubspec.yaml | awk '{print $2}')
          VERSION="${VERSION%%+*}"
          APP=$(find datakeep_flutter/build/macos -name '*.app' -type d | head -1)
          test -d "$APP"
          mkdir -p dist
          STAGE=$(mktemp -d)
          cp -a "$APP" "$STAGE/"
          (cd "$STAGE" && zip -qry "$GITHUB_WORKSPACE/dist/datakeep-${VERSION}-macos.zip" "$(basename "$APP")")
          rm -rf "$STAGE"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: datakeep-macos
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Collect files
        run: |
          set -euo pipefail
          mkdir -p upload
          find artifacts -type f \( -name '*.apk' -o -name '*.zip' -o -name '*.tar.gz' \) \
            -exec cp -v {} upload/ \;
          ls -lh upload/

      - uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
