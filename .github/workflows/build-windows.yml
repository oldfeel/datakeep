# DataKeep — Windows 客户端（公开仓免费）
#
# 用法（网页）:
#   仓库 → Actions → 「Build Windows」→ Run workflow
#
# 用法（命令行）:
#   gh workflow run build-windows.yml
#   gh run watch
#   # 跑完后下载产物:
#   gh run download <run-id> -n datakeep-windows-x64
#
# 产物: datakeep-<version>-windows-x64.zip（内含 Release 可执行文件）

name: Build Windows

on:
  workflow_dispatch:
  # 打 tag 时也可自动编（可选）
  push:
    tags:
      - 'v*'

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: datakeep_flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # syncthing/ 可能被 syncthing_core 引用；保持完整树
          submodules: false
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Pub get
        run: flutter pub get

      - name: Build Windows release
        # webview_cef 首次会下载 CEF，耗时长、体积大
        run: flutter build windows --release

      - name: Package zip
        shell: pwsh
        run: |
          $line = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches.Groups[1].Value
          $version = ($line -split '\+')[0]
          $release = Get-ChildItem -Path build\windows -Recurse -Directory |
            Where-Object { $_.FullName -match '\\runner\\Release$' } |
            Select-Object -First 1
          if (-not $release) { throw 'Release directory not found' }
          $outDir = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $name = "datakeep-$version-windows"
          $stage = Join-Path $env:RUNNER_TEMP $name
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path (Join-Path $release.FullName '*') -Destination $stage -Recurse -Force
          $zip = Join-Path $outDir "$name-x64.zip"
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          Get-Item $zip | Format-List FullName, Length
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: datakeep-windows-x64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
